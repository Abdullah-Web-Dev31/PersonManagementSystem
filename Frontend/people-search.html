<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البحث عن شخص</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:32px 16px;font-family:Tahoma,Arial,sans-serif;background:#f4f6f9;color:#202938}
.container{max-width:760px;margin:auto}
header{margin-bottom:24px}
h1{margin:0 0 8px;font-size:26px}
.subtitle{margin:0;color:#687386;font-size:14px}
.search-card,.result-card{background:#fff;border-radius:12px;padding:22px;box-shadow:0 4px 18px #14233c12;margin-bottom:18px}
label{display:block;margin-bottom:9px;font-size:14px;font-weight:bold}
.search-row{display:flex;gap:10px}
input{flex:1;min-width:0;padding:12px;border:1px solid #d8dee8;border-radius:8px;font-size:15px;outline:none}
input:focus{border-color:#1677d2;box-shadow:0 0 0 3px #1677d21a}
button{border:0;border-radius:8px;background:#1677d2;color:#fff;padding:11px 20px;font-size:14px;cursor:pointer}
button:hover{background:#0f62b2}button:disabled{opacity:.6;cursor:wait}
.status{display:none;padding:12px 14px;border-radius:8px;margin-bottom:16px;font-size:14px;line-height:1.7}
.status.show{display:block}.status.error{background:#fdecec;color:#a12626}.status.info{background:#eaf3ff;color:#14508c}
.result-card{display:none}
.result-card.show{display:block}
.result-title{font-size:17px;margin:0 0 16px}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.detail{background:#f8fafc;border-radius:8px;padding:14px}
.detail-label{display:block;color:#687386;font-size:12px;margin-bottom:7px}
.detail-value{font-size:15px;font-weight:bold;overflow-wrap:anywhere}
.hint{font-size:12px;color:#687386;margin:12px 0 0}
@media(max-width:520px){body{padding:22px 10px}.search-row{flex-direction:column}.search-row button{width:100%}.details{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="container">
<header>
<h1>البحث عن شخص</h1>
<p class="subtitle">ابحث باستخدام رقم الشخص (PersonID)</p>
</header>

<section class="search-card">
<label for="personId">رقم الشخص</label>
<div class="search-row">
<input id="personId" type="number" min="1" step="1" placeholder="مثال: 1">
<button id="searchButton" type="button">بحث</button>
</div>
<p class="hint">أدخل رقم الشخص ثم اضغط على بحث.</p>
</section>

<div id="status" class="status" role="status"></div>

<section id="resultCard" class="result-card">
<h2 class="result-title">بيانات الشخص</h2>
<div class="details">
<div class="detail"><span class="detail-label">رقم الشخص</span><span id="personID" class="detail-value">-</span></div>
<div class="detail"><span class="detail-label">رقم الدولة</span><span id="countryID" class="detail-value">-</span></div>
<div class="detail"><span class="detail-label">الاسم الأول</span><span id="firstName" class="detail-value">-</span></div>
<div class="detail"><span class="detail-label">اسم العائلة</span><span id="lastName" class="detail-value">-</span></div>
</div>
</section>
</main>

<script>
const API_BASE_URL = "https://localhost:7121/api/People/GetPersonByID/";
const personIdInput = document.getElementById("personId");
const searchButton = document.getElementById("searchButton");
const statusBox = document.getElementById("status");
const resultCard = document.getElementById("resultCard");

function showStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = `status show ${type}`;
}
function hideStatus() {
    statusBox.textContent = "";
    statusBox.className = "status";
}
function showPerson(person) {
    document.getElementById("personID").textContent = person.personID ?? person.PersonID ?? "-";
    document.getElementById("firstName").textContent = person.firstName ?? person.FirstName ?? "-";
    document.getElementById("lastName").textContent = person.lastName ?? person.LastName ?? "-";
    document.getElementById("countryID").textContent = person.countryID ?? person.CountryID ?? "-";
    resultCard.classList.add("show");
}
async function searchPerson() {
    const personId = Number(personIdInput.value);

    if (!Number.isInteger(personId) || personId <= 0) {
        resultCard.classList.remove("show");
        showStatus("أدخل رقم شخص صحيحًا أكبر من صفر.", "error");
        personIdInput.focus();
        return;
    }

    searchButton.disabled = true;
    searchButton.textContent = "جاري البحث...";
    resultCard.classList.remove("show");
    showStatus("جاري البحث عن الشخص...", "info");

    try {
        const response = await fetch(`${API_BASE_URL}${encodeURIComponent(personId)}`, {
            method: "GET",
            headers: { "Accept": "application/json" }
        });

        if (response.status === 404) {
            throw new Error("لم يتم العثور على شخص بهذا الرقم.");
        }
        if (!response.ok) {
            throw new Error(`فشل الطلب: HTTP ${response.status}`);
        }

        const person = await response.json();

        if (!person || (Array.isArray(person) && person.length === 0)) {
            throw new Error("لم يتم العثور على بيانات لهذا الشخص.");
        }

        showPerson(person);
        hideStatus();
    } catch (error) {
        resultCard.classList.remove("show");
        showStatus(error.message + " تأكد أيضًا أن API يعمل وأن CORS يسمح بالاتصال.", "error");
        console.error("GetPersonByID error:", error);
    } finally {
        searchButton.disabled = false;
        searchButton.textContent = "بحث";
    }
}

searchButton.addEventListener("click", searchPerson);
personIdInput.addEventListener("keydown", event => {
    if (event.key === "Enter") searchPerson();
});
</script>
</body>
</html>
